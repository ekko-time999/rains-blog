<section class="section" style="padding-top: var(--space-2xl);">
            <div class="container">
                <div style="text-align:center; margin-bottom: var(--space-lg);">
                    <p style="font-family:var(--font-mono); font-size:0.75rem; letter-spacing:0.3em; color:var(--gold); text-transform:uppercase; margin-bottom:0.5rem;">— Curator's Picks —</p>
                    <h1 style="font-family:var(--font-display); font-size:clamp(2rem,5vw,3.5rem); margin-bottom:0.5rem;">私藏</h1>
                    <p style="color:var(--text-dim); font-style:italic;">那些让我反复聆听、观看、阅读的好东西</p>
                </div>
        </section>

        <section class="rec-section">
            <div class="container">
                <div class="rec-filters" id="recFilters">
                    <button class="rec-filter rec-filter--active" data-type="all">全部</button>
                    <button class="rec-filter" data-type="music">♪ 音乐</button>
                    <button class="rec-filter" data-type="musical">🎭 音乐剧</button>
                    <button class="rec-filter" data-type="movie">🎬 电影</button>
                    <button class="rec-filter" data-type="book">📖 书籍</button>
                    <button class="rec-filter" data-type="software">⚙️ 软件</button>
                    <button class="rec-filter" data-type="other">✦ 其他</button>
                </div>
                <div class="rec-grid" id="recGrid">
                    <div style="grid-column:1/-1;text-align:center;padding:var(--space-3xl);color:var(--text-dim);">加载中...</div>
                </div>
            </div>
        </section>
